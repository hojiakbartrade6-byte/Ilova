#app{height:100%;max-width:480px;margin:auto;display:flex;flex-direction:column}
#main{flex:1;overflow-y:auto;padding:14px}
nav{display:flex;background:var(--card);border-top:1px solid var(--bd)}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:8px 2px;font-size:11px;cursor:pointer}
nav button b{display:block;font-size:20px;font-weight:400}
nav button.on{color:var(--ac);font-weight:600}
h2{margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}
.av{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.mu{color:var(--mu);font-size:13px}
button.p,.btn{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:10px 14px;font-size:14px;cursor:pointer}
button.g{background:none;border:1px solid var(--bd);color:var(--tx);border-radius:12px;padding:8px 12px;cursor:pointer}
input,select{width:100%;padding:11px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:15px}
.fl{display:flex;gap:8px;margin:8px 0}
.msg{max-width:78%;padding:8px 12px;border-radius:14px;margin:4px 0;background:var(--card);border:1px solid var(--bd)}
.msg.me{margin-left:auto;background:var(--ac);color:#fff;border:0}
.login{height:100%;display:grid;place-content:center;text-align:center;gap:16px;padding:24px}
.gbtn{display:flex;align-items:center;gap:10px;justify-content:center;background:#fff;color:#222;border:1px solid #ddd;border-radius:24px;padding:12px 20px;font-size:15px;cursor:pointer}
.gbtn i{font-style:normal;font-weight:700;color:#4285f4}
.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:20px;z-index:5}
.modal>div{background:var(--card);border-radius:18px;padding:16px;width:100%;max-width:360px}
.sh{height:62vh;border-radius:20px;color:#fff;padding:18px;display:flex;flex-direction:column;justify-content:flex-end;margin-bottom:10px}
.sh h3{margin:0 0 6px;font-size:22px}
.act{display:flex;gap:8px;margin-top:10px}
.act button{background:#fff3;border:0;color:#fff;border-radius:20px;padding:8px 14px;cursor:pointer;font-size:14px}
.cm{padding:6px 0;border-bottom:1px solid var(--bd);font-size:14px}
.cube{width:90px;height:90px;margin:30px auto;transform-style:preserve-3d;animation:r 6s linear infinite}
.cube div{position:absolute;width:90px;height:90px;background:linear-gradient(135deg,var(--ac),var(--ac2));opacity:.85;border:1px solid #fff6}
@keyframes r{to{transform:rotateX(360deg) rotateY(360deg)}}
#arena{position:relative;height:260px;background:rgba(0,0,0,.35);border-radius:14px;border:1px solid var(--bd);overflow:hidden}
#tg{position:absolute;width:44px;height:44px;border-radius:50%;background:var(--ac2);border:0;font-size:22px;cursor:pointer}
